<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:128px;height:128px;overflow:hidden;background:transparent}
.bg{width:128px;height:128px;border-radius:28px;background:linear-gradient(180deg,#1c1f2b,#12141c);position:relative}
.card{position:absolute;left:22px;top:30px;width:84px;height:68px;border-radius:9px;background:#2b3040;border:1px solid #3b4155;box-sizing:border-box}
.n{position:absolute;left:10px;top:11px;width:36px;height:7px;border-radius:4px;background:#e5e7f0}
.p{position:absolute;left:51px;top:10px;width:22px;height:9px;border-radius:5px;background:#c2410c}
.d{position:absolute;left:10px;top:26px;width:60px;height:5px;border-radius:3px;background:#4a5068}
.dots{position:absolute;left:10px;top:43px;display:flex;gap:6px}
.dots span{width:11px;height:11px;border-radius:50%}
</style></head><body><div class="bg"><div class="card">
<div class="n"></div><div class="p"></div><div class="d"></div>
<div class="dots"><span style="background:#c2410c"></span><span style="background:#2185d0"></span><span style="background:#609926"></span><span style="background:#21759b"></span></div>
</div></div></body></html>
