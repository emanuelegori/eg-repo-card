<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:772px;height:250px;overflow:hidden}
body{background:linear-gradient(180deg,#181a24 0%,#10121a 100%);font-family:Lato,sans-serif;position:relative}
.t{position:absolute;left:57px;top:72px;color:#fff;font-weight:900;font-size:43px;letter-spacing:-.3px}

.card{position:absolute;right:52px;top:70px;width:250px;height:110px;border-radius:12px;background:#262a38;border:1px solid #363b4d;box-sizing:border-box;padding:16px}
.h{display:flex;align-items:center;gap:8px}
.n{width:96px;height:11px;border-radius:6px;background:#e5e7f0}

.b{height:20px;border-radius:5px;background:#363b4d;display:flex;align-items:center;padding:0 6px;gap:4px}
.dot{width:8px;height:8px;border-radius:50%}
.l{width:12px;height:5px;border-radius:3px;background:#8b91aa}

<div class="t">EG Repo Card</div>

<div class="card">
 <div class="h"><div class="n"></div><div class="p"></div></div>

 <div class="r">
  <div class="b"><span class="dot" style="background:#c2410c"></span><span class="l"></span></div>

  <div class="b"><span class="dot" style="background:#21759b"></span><span class="l"></span></div>
 </div>
</div>
</body></html>
